{{- /* Structured data (JSON-LD) for Dev9b, emitted as a single @graph.
     NOTE: Every jsonify expression is piped through safeJS. Hugo's jsonify returns a plain
     string; inside a <script> block the html/template JS context would otherwise escape
     quotes, producing invalid JSON-LD. */ -}}
{{- $siteName := "F9XR's Dev9b" -}}
{{- $siteURL  := string .Site.BaseURL -}}
{{- $orgURL   := "https://f9xr.org/" -}}
{{- $logoURL  := (printf "%simg/f9xr-logo.webp" $siteURL) -}}
{{- $locale   := "en-US" -}}

{{- $sameAs := slice
    "https://github.com/f9xr"
    "https://github.com/f9xr/dev9b"
    "https://linkedin.com/company/f9xrteam"
    "https://pinterest.com/f9xr"
    "https://youtube.com/@QuarterlyLIV"
    "https://instagram.com/f9xrteam" -}}

{{- $graph := slice -}}

{{/* Organization: authoritativeness & trust (E-E-A-T). Output on every page. */}}
{{- $organization := dict
    "@type" "Organization"
    "@id" (printf "%s#organization" $orgURL)
    "name" "F9XR Team"
    "alternateName" "Dev9b"
    "url" $orgURL
    "logo" (dict "@type" "ImageObject" "url" $logoURL "caption" "F9XR Team logo")
    "foundingDate" "2024"
    "description" "F9XR Team is an open-source developer community publishing tutorials, articles, and coding guides on Dev9b."
    "knowsAbout" (slice "Software Development" "Open Source" "Developer Tutorials" "Hugo" "Static Sites" "Web Development")
    "sameAs" $sameAs
    "contactPoint" (dict
        "@type" "ContactPoint"
        "contactType" "customer support"
        "email" "hello@f9xr.org"
        "url" $orgURL
        "areaServed" "Worldwide"
        "availableLanguage" (slice "English"))
-}}
{{- $graph = $graph | append $organization -}}

{{- if .IsHome }}
{{/* WebSite + SearchAction on the homepage only. */}}
{{- $searchURL := (printf "%ssearch/?keyword={search_term_string}" $siteURL) -}}
{{- $website := dict
    "@type" "WebSite"
    "@id" (printf "%s#website" $siteURL)
    "name" $siteName
    "url" $siteURL
    "description" (.Site.Params.description | default .Site.Params.sidebar.subtitle | default $siteName)
    "publisher" (dict "@id" (printf "%s#organization" $orgURL))
    "inLanguage" $locale
    "potentialAction" (dict
        "@type" "SearchAction"
        "target" (dict "@type" "EntryPoint" "urlTemplate" $searchURL)
        "query-input" (dict "@type" "PropertyValueSpecification" "valueRequired" true "valueName" "search_term_string"))
-}}
{{- $graph = $graph | append $website -}}
{{- else }}
{{/* BreadcrumbList for every non-home page & post. */}}
{{- $crumbs := slice (dict "@type" "ListItem" "position" 1 "name" "Home" "item" $siteURL) -}}
{{- $crumbs = $crumbs | append (dict "@type" "ListItem" "position" 2 "name" .Title "item" .Permalink) -}}
{{- $breadcrumb := dict "@type" "BreadcrumbList" "itemListElement" $crumbs -}}
{{- $graph = $graph | append $breadcrumb -}}
{{- end -}}

{{- if and .IsPage (eq .Type "post") }}
{{- /* Article / TechArticle for blog posts. */ -}}
{{- $authorName := .Params.author | default "F9XR Team" -}}
{{- $author := dict -}}
{{- if eq $authorName "F9XR Team" -}}
    {{- $author = dict "@type" "Organization" "@id" (printf "%s#organization" $orgURL) "name" "F9XR Team" "url" $orgURL "sameAs" $sameAs -}}
{{- else -}}
    {{- $author = dict "@type" "Person" "name" $authorName -}}
    {{- with .Params.authorUrl }}{{ $author = merge $author (dict "url" .) }}{{ end -}}
    {{- with .Params.authorGitHub }}
        {{- $author = merge $author (dict "sameAs" (slice (printf "https://github.com/%s" .))) }}
    {{- end -}}
{{- end -}}

{{- $imageURL := $logoURL -}}
{{- if .Params.image }}{{ $imageURL = printf "%s%s" .Permalink .Params.image }}{{ end -}}
{{- $articleImage := dict
    "@type" "ImageObject"
    "@id" (printf "%s#primaryimage" .Permalink)
    "url" $imageURL
    "caption" .Title -}}
{{- $imageResource := partial "helper/image" (dict "Image" .Params.image "Resources" .Resources "Context" .) -}}
{{- with $imageResource -}}
    {{- with .Width }}{{ $articleImage = merge $articleImage (dict "width" .) }}{{ end -}}
    {{- with .Height }}{{ $articleImage = merge $articleImage (dict "height" .) }}{{ end -}}
{{- end -}}

{{- $webpage := dict
    "@type" "WebPage"
    "@id" .Permalink
    "url" .Permalink
    "name" .Title
    "inLanguage" $locale
    "isPartOf" (dict "@id" (printf "%s#website" $siteURL))
    "primaryImageOfPage" (dict "@id" (printf "%s#primaryimage" .Permalink))
-}}
{{- $graph = $graph | append $webpage -}}

{{- $keywords := .Params.keywords | default slice -}}
{{- $categories := .Params.categories | default slice -}}
{{- $articleDict := dict
    "@type" (.Params.schemaType | default "TechArticle")
    "@id" (printf "%s#article" .Permalink)
    "headline" .Title
    "description" (partial "data/description" .)
    "image" (dict "@id" (printf "%s#primaryimage" .Permalink))
    "datePublished" (.Date.Format "2006-01-02T15:04:05-07:00")
    "dateModified" (.Lastmod.Format "2006-01-02T15:04:05-07:00")
    "author" $author
    "publisher" (dict "@id" (printf "%s#organization" $orgURL))
    "mainEntityOfPage" (dict "@id" .Permalink)
    "isPartOf" (dict "@id" (printf "%s#website" $siteURL))
    "inLanguage" $locale
    "wordCount" .WordCount
    "timeRequired" (printf "PT%dM" .ReadingTime)
    "isAccessibleForFree" true
    "license" "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    "speakable" (dict
        "@type" "SpeakableSpecification"
        "cssSelector" (slice ".article-content h2" ".article-content h3" ".article-content p")
    )
-}}
{{- if gt (len $keywords) 0 }}
    {{- $articleDict = merge $articleDict (dict "keywords" $keywords) }}
{{- end }}
{{- if gt (len $categories) 0 }}
    {{- $articleDict = merge $articleDict (dict "articleSection" $categories) }}
{{- end }}
{{- $imageNode := $articleImage -}}
{{- $graph = $graph | append $imageNode -}}
{{- $graph = $graph | append $articleDict -}}

{{- $faq := (.Params.faq | default slice) }}
{{- if gt (len $faq) 0 }}
{{- $faqList := slice -}}
{{- range $faq -}}
    {{- $faqList = $faqList | append (dict
        "@type" "Question"
        "name" .question
        "acceptedAnswer" (dict "@type" "Answer" "text" .answer)
    ) -}}
{{- end -}}
{{- $faqNode := dict
    "@type" "FAQPage"
    "@id" (printf "%s#faq" .Permalink)
    "mainEntity" $faqList
-}}
{{- $graph = $graph | append $faqNode -}}
{{- end -}}
{{- end -}}

{{- $payload := dict "@context" "https://schema.org" "@graph" $graph -}}
<script type="application/ld+json">
{{- $payload | jsonify | safeJS -}}
</script>

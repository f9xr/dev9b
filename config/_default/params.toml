# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/f9x-logo.webp"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2024
    customText = "Built by F9XR Team. Open-source under MIT License."

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "🚀"
    subtitle = "An open-source developer blog by F9XR Team. Share knowledge, write articles, grow together."
    avatar   = "img/f9x-logo.webp"

[article]
    headingAnchor = false
    math          = true
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph]
[opengraph.twitter]
    # No Twitter/X account exists for F9XR - leave site empty so no fake handle is emitted
    site = ""
    card = "summary_large_image"

## SEO metadata (read by layouts/_partials/head/custom.html)
[meta]
    author = "F9XR Team"
    oglocale = "en_US"
    geoRegion = "NO"
    geoPlacename = "Norway"
    geoPosition = ""

## Search engine verification codes (fill in after registering in the respective consoles)
[verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    facebook = ""

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
[comments]
    enabled  = true
    provider = "disqus"

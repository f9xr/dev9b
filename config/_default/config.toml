# Change baseurl before deploy
baseurl = "https://f9xr.org/"
locale  = "en-us"
title   = "F9XR's Dev9b"
enableRobotsTXT = true
description = "F9XR's Dev9b is an open-source blog article publishing platform by F9XR Team. We share latest articles, tutorials, coding videos, and developer guides for the open developer community."
enableGitInfo = true

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

# Change it to your Disqus shortname before using
disqusShortname = "dev9b"

[pagination]
    pagerSize = 10
    disableAliases = true

# Additional syndication feeds: feed.xml (RSS 2.0) and atom.xml (Atom 1.0)
# alongside the default RSS index.xml.
[mediaTypes]
    [mediaTypes."application/atom+xml"]
        suffixes = ["xml"]
    [mediaTypes."application/feed+json"]
        suffixes = ["json"]
    [mediaTypes."text/markdown"]
        suffixes = ["md"]

[outputFormats.feed]
    mediaType = "application/rss+xml"
    baseName  = "feed"
    notAlternative = true                # index.xml stays the advertised RSS alternate

[outputFormats.atom]
    mediaType = "application/atom+xml"
    baseName  = "atom"

# JSON Feed 1.1 (jsonfeed.org) for feed readers and agents that prefer JSON.
[outputFormats.feedjson]
    mediaType = "application/feed+json"
    baseName  = "feed"
    isPlainText = true
    notAlternative = true

# Machine-readable LLM/agent surface (generated from content, never hand-edited).
[outputFormats.llms]
    mediaType = "text/plain"
    baseName  = "llms"
    isPlainText = true
    notAlternative = true

[outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName  = "llms-full"
    isPlainText = true
    notAlternative = true

[outputFormats.articles]
    mediaType = "text/plain"
    baseName  = "articles-urls"
    isPlainText = true
    notAlternative = true

# Per-page raw Markdown (served as /p/<slug>/index.md).
[outputFormats.markdown]
    mediaType = "text/markdown"
    baseName  = "index"
    isPlainText = true

[outputs]
    home = ["HTML", "RSS", "feed", "atom", "feedjson", "llms", "llmsfull", "articles"]
    page = ["HTML", "markdown"]

name: Build and deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.165.0
      NODE_VERSION: 24.12.0
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '${{ env.HUGO_VERSION }}'
          extended: true
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Verify machine-readable outputs
        run: |
          set -euo pipefail
          fail=0
          for f in llms.txt llms-full.txt articles-urls.txt feed.json robots.txt sitemap.xml \
                   .well-known/ai-catalog.json .well-known/agent-skills/index.json .well-known/security.txt; do
            if [[ -f "public/$f" ]]; then
              echo "OK   public/$f"
            else
              echo "MISS public/$f"; fail=1
            fi
          done
          # Every post must ship a raw markdown alternate.
          missing_md=$(find public/p -mindepth 2 -maxdepth 2 -name index.html -printf '%h\n' | while read -r d; do [[ -f "$d/index.md" ]] || echo "$d"; done | wc -l)
          echo "posts missing index.md: $missing_md"
          [[ "$missing_md" -eq 0 ]] || fail=1
          # Validate JSON files.
          for j in public/feed.json public/.well-known/ai-catalog.json public/.well-known/agent-skills/index.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$j" && echo "JSON OK $j" || fail=1
          done
          exit $fail
      - name: Notify search engines and IndexNow
        run: |
          set -euo pipefail
          BASE="${{ steps.pages.outputs.base_url }}"
          python3 - "$BASE" <<'PY'
          import json, sys, urllib.request
          base = sys.argv[1].rstrip('/')
          urls = []
          with open('public/articles-urls.txt', encoding='utf-8') as fh:
              for line in fh:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      if line.startswith('http://'):
                          line = 'https://' + line[len('http://'):]
                      urls.append(line)
          payload = {
              "host": "f9xr.org",
              "key": "3FFE8AD1224F6498C1B5162A3A4A4907",
              "keyLocation": "https://f9xr.org/dev9b/3FFE8AD1224F6498C1B5162A3A4A4907.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow:", r.status, "urls:", len(urls))
          except Exception as e:
              print("IndexNow warning:", e)
          try:
              with urllib.request.urlopen(f"https://www.google.com/ping?sitemap={base}/sitemap.xml", timeout=30) as r:
                  print("Google sitemap ping:", r.status)
          except Exception as e:
              print("Google ping warning:", e)
          PY
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
